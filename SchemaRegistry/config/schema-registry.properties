# Schema Registry Configuration for Data Warehouse Project

# Listeners and Host Configuration
listeners=http://0.0.0.0:8081
host.name=schema-registry
debug=false

# Kafka Store Configuration
kafkastore.bootstrap.servers=kafka:29092
kafkastore.topic=_schemas
kafkastore.topic.replication.factor=1

# Group and Master Election
schema.registry.group.id=schema-registry
master.eligibility=true
leader.eligibility=true

# Kafka Store Timeouts
kafkastore.timeout.ms=500
kafkastore.init.timeout.ms=60000
kafkastore.connection.timeout.ms=1000
kafkastore.session.timeout.ms=30000

# Schema Compatibility
schema.compatibility.level=BACKWARD
schema.providers=io.confluent.kafka.schemaregistry.avro.AvroSchemaProvider,io.confluent.kafka.schemaregistry.json.JsonSchemaProvider,io.confluent.kafka.schemaregistry.protobuf.ProtobufSchemaProvider

# Response Configuration
response.mediatype.preferred=application/vnd.schemaregistry.v1+json,application/vnd.schemaregistry+json,application/json

# CORS Configuration for Web UI Integration
access.control.allow.origin=*
access.control.allow.methods=GET,POST,PUT,DELETE,OPTIONS,HEAD
access.control.allow.headers=origin,content-type,accept,authorization,x-requested-with

# Security Configuration (Development Mode)
authentication.method=NONE
authorization.method=NONE

# SSL Configuration (Disabled for Development)
ssl.keystore.location=
ssl.keystore.password=
ssl.truststore.location=
ssl.truststore.password=
ssl.key.password=

# Inter-Instance Communication
inter.instance.protocol=http
inter.instance.listener=http://0.0.0.0:8081

# Cache Configuration
schema.cache.size=1000
schema.cache.expiry.secs=300

# Request Logging
request.logger.name=io.confluent.rest-utils.requests

# Metrics Configuration
enable.metrics=true
metrics.sample.window.ms=30000
metrics.num.samples=2

# Thread Pool Configuration
request.timeout.ms=60000
response.timeout.ms=30000

# Schema Evolution Settings
schema.deletion.policy=soft
schema.evolution.compatibility.check=true

# Avro Configuration
avro.compatibility.level=BACKWARD
avro.use.logical.type.converters=true

# JSON Schema Configuration
json.schema.spec.version=draft7

# Protobuf Configuration
protobuf.allow.multiple.files=true

# Consumer and Producer Settings for Internal Kafka Store
kafkastore.consumer.enable.auto.commit=true
kafkastore.consumer.auto.commit.interval.ms=1000
kafkastore.consumer.auto.offset.reset=earliest
kafkastore.consumer.fetch.min.bytes=1
kafkastore.consumer.fetch.max.wait.ms=500

kafkastore.producer.acks=all
kafkastore.producer.retries=2147483647
kafkastore.producer.max.in.flight.requests.per.connection=5
kafkastore.producer.enable.idempotence=true 