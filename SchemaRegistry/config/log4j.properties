# Log4j Configuration for Schema Registry - Data Warehouse Project

# Root logger configuration
log4j.rootLogger=INFO, stdout, schemaRegistryAppender

# Console appender
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=[%d] %p %m (%c)%n

# Schema Registry log appender
log4j.appender.schemaRegistryAppender=org.apache.log4j.DailyRollingFileAppender
log4j.appender.schemaRegistryAppender.DatePattern='.'yyyy-MM-dd-HH
log4j.appender.schemaRegistryAppender.File=/tmp/logs/schema-registry/schema-registry.log
log4j.appender.schemaRegistryAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.schemaRegistryAppender.layout.ConversionPattern=[%d] %p %m (%c)%n

# API request log appender
log4j.appender.requestAppender=org.apache.log4j.DailyRollingFileAppender
log4j.appender.requestAppender.DatePattern='.'yyyy-MM-dd-HH
log4j.appender.requestAppender.File=/tmp/logs/schema-registry/requests.log
log4j.appender.requestAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.requestAppender.layout.ConversionPattern=[%d] %p %m (%c)%n

# Kafka store log appender
log4j.appender.kafkaStoreAppender=org.apache.log4j.DailyRollingFileAppender
log4j.appender.kafkaStoreAppender.DatePattern='.'yyyy-MM-dd-HH
log4j.appender.kafkaStoreAppender.File=/tmp/logs/schema-registry/kafka-store.log
log4j.appender.kafkaStoreAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.kafkaStoreAppender.layout.ConversionPattern=[%d] %p %m (%c)%n

# Performance log appender
log4j.appender.performanceAppender=org.apache.log4j.DailyRollingFileAppender
log4j.appender.performanceAppender.DatePattern='.'yyyy-MM-dd-HH
log4j.appender.performanceAppender.File=/tmp/logs/schema-registry/performance.log
log4j.appender.performanceAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.performanceAppender.layout.ConversionPattern=[%d] %p %m (%c)%n

# Schema Registry Core Loggers
log4j.logger.io.confluent.kafka.schemaregistry=INFO
log4j.logger.io.confluent.kafka.schemaregistry.storage=INFO, kafkaStoreAppender
log4j.additivity.io.confluent.kafka.schemaregistry.storage=false

log4j.logger.io.confluent.kafka.schemaregistry.rest=INFO
log4j.logger.io.confluent.kafka.schemaregistry.avro=INFO
log4j.logger.io.confluent.kafka.schemaregistry.json=INFO
log4j.logger.io.confluent.kafka.schemaregistry.protobuf=INFO

# REST API and Request Logging
log4j.logger.io.confluent.rest-utils.requests=INFO, requestAppender
log4j.additivity.io.confluent.rest-utils.requests=false

log4j.logger.org.eclipse.jetty=WARN
log4j.logger.org.eclipse.jetty.server=WARN
log4j.logger.org.eclipse.jetty.servlet=WARN

# Kafka Client Loggers
log4j.logger.org.apache.kafka=WARN, kafkaStoreAppender
log4j.additivity.org.apache.kafka=false

log4j.logger.org.apache.kafka.clients=WARN
log4j.logger.org.apache.kafka.clients.consumer=INFO
log4j.logger.org.apache.kafka.clients.producer=INFO

# Schema Evolution and Compatibility Loggers
log4j.logger.io.confluent.kafka.schemaregistry.client=INFO
log4j.logger.io.confluent.kafka.schemaregistry.compatibility=INFO

# Performance and Metrics Loggers
log4j.logger.io.confluent.kafka.schemaregistry.metrics=INFO, performanceAppender
log4j.additivity.io.confluent.kafka.schemaregistry.metrics=false

# Security Loggers
log4j.logger.io.confluent.kafka.schemaregistry.security=INFO
log4j.logger.kafka.authorizer.logger=INFO

# Master Election and Leadership Loggers
log4j.logger.io.confluent.kafka.schemaregistry.masterelector=INFO
log4j.logger.io.confluent.kafka.schemaregistry.leaderelection=INFO

# Cache Loggers
log4j.logger.io.confluent.kafka.schemaregistry.storage.LookupCache=INFO

# Serialization/Deserialization Loggers  
log4j.logger.io.confluent.kafka.serializers=INFO
log4j.logger.io.confluent.kafka.formatter=INFO

# Suppress verbose logs
log4j.logger.org.apache.zookeeper=ERROR
log4j.logger.org.I0Itec.zkclient=ERROR
log4j.logger.org.reflections=ERROR
log4j.logger.kafka.utils.Log4jControllerRegistration=ERROR

# Development/Debug Loggers (uncomment for debugging)
# log4j.logger.io.confluent.kafka.schemaregistry.storage.KafkaSchemaRegistry=DEBUG
# log4j.logger.io.confluent.kafka.schemaregistry.rest.SchemaRegistryRestApplication=DEBUG
# log4j.logger.io.confluent.kafka.schemaregistry.storage.LookupCache=DEBUG 