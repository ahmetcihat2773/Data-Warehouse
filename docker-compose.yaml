services:
  # PostgreSQL Source Database
  postgres-source:
    build:
      context: ./Database/Postgres
      dockerfile: Dockerfile
    container_name: dwh-postgres-source
    env_file:
      - ./Database/Postgres/env.list
    ports:
      - "5432:5432"
    volumes:
      - postgres_source_data:/var/lib/postgresql/data
    networks:
      - dwh-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source_user -d source_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Data Generator Service
  data-generator:
    build:
      context: ./DataGenerator
      dockerfile: Dockerfile
    container_name: dwh-data-generator
    depends_on:
      postgres-source:
        condition: service_healthy
    environment:
      - POSTGRES_DB=source_db
      - POSTGRES_USER=source_user
      - POSTGRES_PASSWORD=source_password
      - POSTGRES_HOST=dwh-postgres-source
      - POSTGRES_PORT=5432
    networks:
      - dwh-network
    restart: unless-stopped

  # PostgreSQL Sink Database  
  postgres-sink:
    build:
      context: ./Database/PostgresSink
      dockerfile: Dockerfile
    container_name: dwh-postgres-sink
    env_file:
      - ./Database/PostgresSink/env.list
    ports:
      - "5435:5432"
    volumes:
      - postgres_sink_data:/var/lib/postgresql/data
    networks:
      - dwh-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinkuser -d sinkdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Broker with KRaft mode (no Zookeeper needed)
  kafka:
    build:
      context: ./KafkaBrokers
      dockerfile: Dockerfile
    container_name: dwh-kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    env_file:
      - ./KafkaBrokers/env.list
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - dwh-network
    user: root
    healthcheck:
      test: ["CMD", "bash", "-c", "nc -z 0.0.0.0 9092 && nc -z 0.0.0.0 29092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # Schema Registry
  schema-registry:
    build:
      context: ./SchemaRegistry
      dockerfile: Dockerfile
    container_name: dwh-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    env_file:
      - ./SchemaRegistry/env.list
    networks:
      - dwh-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Connect
  kafka-connect:
    build:
      context: ./ConnectPostgres
      dockerfile: Dockerfile
    container_name: dwh-kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgres-source:
        condition: service_healthy
      postgres-sink:
        condition: service_healthy
    ports:
      - "8083:8083"
    env_file:
      - ./ConnectPostgres/env.list
    networks:
      - dwh-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Kafka UI for management
  kafka-ui:
    build:
      context: ./KafkaUI
      dockerfile: Dockerfile
    container_name: dwh-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - ./KafkaUI/env.list
    networks:
      - dwh-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_source_data:
  postgres_sink_data:
  kafka_data:

networks:
  dwh-network:
    driver: bridge
