# PostgreSQL configuration for Sink Database
# Optimized for receiving data from Kafka Connect

# Connection settings
listen_addresses = '*'
port = 5432
max_connections = 100

# Memory settings
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 4MB
maintenance_work_mem = 64MB

# WAL settings (minimal for sink database)
wal_level = replica                    # Minimal WAL level for sink
max_wal_senders = 0                    # No replication needed
max_replication_slots = 0              # No replication slots needed
wal_buffers = 16MB

# Checkpointing settings
checkpoint_completion_target = 0.9
checkpoint_segments = 32

# Performance settings for write-heavy workload
synchronous_commit = off               # Better performance for bulk inserts
wal_writer_delay = 200ms              # Optimize for batch writes
commit_delay = 1000                   # Group commits for better performance
commit_siblings = 5

# Logging settings
log_destination = 'stderr'
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-sink-%Y-%m-%d_%H%M%S.log'
log_statement = 'mod'                  # Log modifications
log_min_duration_statement = 1000      # Log slow queries

# Other settings
timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'

# Optimization for bulk operations
random_page_cost = 1.1
effective_io_concurrency = 200
autovacuum = on
autovacuum_naptime = 1min             # More frequent autovacuum for sink 