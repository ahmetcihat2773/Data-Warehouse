# Log4j Configuration for Kafka Connect - Data Warehouse Project

# Root logger configuration
log4j.rootLogger=INFO, stdout, connectAppender

# Console appender
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=[%d] %p %m (%c)%n

# Connect log appender
log4j.appender.connectAppender=org.apache.log4j.DailyRollingFileAppender
log4j.appender.connectAppender.DatePattern='.'yyyy-MM-dd-HH
log4j.appender.connectAppender.File=/tmp/logs/kafka-connect/connect.log
log4j.appender.connectAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.connectAppender.layout.ConversionPattern=[%d] %p %m (%c)%n

# Connector task log appender
log4j.appender.taskAppender=org.apache.log4j.DailyRollingFileAppender
log4j.appender.taskAppender.DatePattern='.'yyyy-MM-dd-HH
log4j.appender.taskAppender.File=/tmp/logs/kafka-connect/connect-tasks.log
log4j.appender.taskAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.taskAppender.layout.ConversionPattern=[%d] %p %m (%c)%n

# Debezium CDC log appender
log4j.appender.debeziumAppender=org.apache.log4j.DailyRollingFileAppender
log4j.appender.debeziumAppender.DatePattern='.'yyyy-MM-dd-HH
log4j.appender.debeziumAppender.File=/tmp/logs/kafka-connect/debezium-cdc.log
log4j.appender.debeziumAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.debeziumAppender.layout.ConversionPattern=[%d] %p %m (%c)%n

# JDBC connector log appender
log4j.appender.jdbcAppender=org.apache.log4j.DailyRollingFileAppender
log4j.appender.jdbcAppender.DatePattern='.'yyyy-MM-dd-HH
log4j.appender.jdbcAppender.File=/tmp/logs/kafka-connect/jdbc-connector.log
log4j.appender.jdbcAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.jdbcAppender.layout.ConversionPattern=[%d] %p %m (%c)%n

# Logger configurations
log4j.logger.org.apache.kafka.connect=INFO
log4j.logger.org.apache.kafka.connect.runtime.Worker=INFO
log4j.logger.org.apache.kafka.connect.runtime.WorkerTask=INFO, taskAppender
log4j.additivity.org.apache.kafka.connect.runtime.WorkerTask=false

# Debezium specific loggers
log4j.logger.io.debezium=INFO, debeziumAppender
log4j.additivity.io.debezium=false

log4j.logger.io.debezium.connector.postgresql=INFO, debeziumAppender
log4j.additivity.io.debezium.connector.postgresql=false

# JDBC connector specific loggers
log4j.logger.io.confluent.connect.jdbc=INFO, jdbcAppender
log4j.additivity.io.confluent.connect.jdbc=false

# Connector runtime loggers
log4j.logger.org.apache.kafka.connect.runtime.WorkerSourceTask=INFO, taskAppender
log4j.additivity.org.apache.kafka.connect.runtime.WorkerSourceTask=false

log4j.logger.org.apache.kafka.connect.runtime.WorkerSinkTask=INFO, taskAppender
log4j.additivity.org.apache.kafka.connect.runtime.WorkerSinkTask=false

# Storage loggers
log4j.logger.org.apache.kafka.connect.storage.KafkaConfigBackingStore=INFO
log4j.logger.org.apache.kafka.connect.storage.KafkaOffsetBackingStore=INFO
log4j.logger.org.apache.kafka.connect.storage.KafkaStatusBackingStore=INFO

# Schema registry loggers
log4j.logger.io.confluent.kafka.schemaregistry=INFO
log4j.logger.io.confluent.connect.avro=INFO

# Database connection loggers
log4j.logger.org.postgresql=INFO
log4j.logger.com.zaxxer.hikari=INFO

# Suppress some verbose logs
log4j.logger.org.apache.zookeeper=ERROR
log4j.logger.org.I0Itec.zkclient=ERROR
log4j.logger.org.reflections=ERROR
log4j.logger.org.eclipse.jetty=WARN

# CDC specific debugging (can be enabled for troubleshooting)
