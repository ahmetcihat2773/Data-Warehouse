# Kafka Server Configuration for Data Warehouse Project
# KRaft Mode Configuration (No Zookeeper)

# Broker and Controller Settings
node.id=1
process.roles=broker,controller
controller.quorum.voters=1@kafka:29093

# Listener Configuration - Fixed for Docker networking
listeners=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
advertised.listeners=INTERNAL://kafka:29092,EXTERNAL://host.docker.internal:9092
listener.security.protocol.map=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
inter.broker.listener.name=INTERNAL
controller.listener.names=CONTROLLER

# Log Configuration
log.dirs=/tmp/kraft-combined-logs
num.partitions=3
default.replication.factor=1
min.insync.replicas=1

# Log Retention Policy
log.retention.hours=168
log.retention.bytes=1073741824
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000
log.cleanup.policy=delete

# Topic Configuration
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
auto.create.topics.enable=true

# Network and IO Configuration
num.network.threads=8
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

# Message Size Configuration
message.max.bytes=1000000
replica.fetch.max.bytes=1048576

# Compression
compression.type=producer
log.compression.type=producer

# Performance Settings
num.replica.fetchers=1
replica.lag.time.max.ms=30000
replica.socket.timeout.ms=30000
replica.socket.receive.buffer.bytes=65536

# Controller Configuration
controller.socket.timeout.ms=30000
controller.message.queue.size=10

# Metrics and JMX
metric.reporters=
metrics.num.samples=2
metrics.sample.window.ms=30000

# Security (for development - plaintext)
# Using inter.broker.listener.name instead of deprecated security.inter.broker.protocol

# Other Settings
broker.id.generation.enable=false
reserved.broker.max.id=1000 