# PostgreSQL configuration for CDC/Debezium
# Custom configuration for source database

# Connection settings
listen_addresses = '*'
port = 5432
max_connections = 100

# Memory settings
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 4MB
maintenance_work_mem = 64MB

# WAL (Write-Ahead Logging) settings for logical replication
wal_level = logical                    # Required for Debezium CDC
max_wal_senders = 3                    # Number of concurrent WAL senders
max_replication_slots = 3              # Number of replication slots
wal_keep_segments = 32                 # Keep WAL segments
wal_sender_timeout = 60s               # WAL sender timeout

# Checkpointing settings
checkpoint_completion_target = 0.9
wal_buffers = 16MB
checkpoint_segments = 32

# Logging settings
log_destination = 'stderr'
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_statement = 'mod'                  # Log modifications for debugging
log_min_duration_statement = 1000      # Log slow queries (>1 second)
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# Other settings
timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'

# Performance settings
random_page_cost = 1.1
effective_io_concurrency = 200 