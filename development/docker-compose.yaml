services:
  # PostgreSQL Source Database
  postgres-source:
    build:
      context: ./Database/Postgres
      dockerfile: Dockerfile
    container_name: dwh-postgres-source
    env_file:
      - ./Database/Postgres/env.list
    ports:
      - "5432:5432"
    volumes:
      - postgres_source_data:/var/lib/postgresql/data
    networks:
      - dwh-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source_user -d source_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Data Generator Service
  data-generator:
    build:
      context: ./DataGenerator
      dockerfile: Dockerfile
    container_name: dwh-data-generator
    depends_on:
      postgres-source:
        condition: service_healthy
    environment:
      - POSTGRES_DB=source_db
      - POSTGRES_USER=source_user
      - POSTGRES_PASSWORD=source_password
      - POSTGRES_HOST=dwh-postgres-source
      - POSTGRES_PORT=5432
    networks:
      - dwh-network
    restart: unless-stopped

  # PostgreSQL Sink Database  
  postgres-sink:
    build:
      context: ./Database/PostgresSink
      dockerfile: Dockerfile
    container_name: dwh-postgres-sink
    env_file:
      - ./Database/PostgresSink/env.list
    ports:
      - "5435:5432"
    volumes:
      - postgres_sink_data:/var/lib/postgresql/data
    networks:
      - dwh-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinkuser -d sinkdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper for Kafka coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    container_name: dwh-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - dwh-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'srvr' | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Broker with Zookeeper
  kafka:
    build:
      context: ./KafkaBrokers
      dockerfile: Dockerfile
    container_name: dwh-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
      - "9101:9101"
    env_file:
      - ./KafkaBrokers/env.list
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - dwh-network
    # healthcheck:
    #   test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
    #   interval: 15s
    #   timeout: 10s
    #   retries: 5

  # Schema Registry
  schema-registry:
    build:
      context: ./SchemaRegistry
      dockerfile: Dockerfile
    container_name: dwh-schema-registry
    depends_on:
      kafka:
        condition: service_started
    ports:
      - "8081:8081"
    env_file:
      - ./SchemaRegistry/env.list
    networks:
      - dwh-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Connect
  kafka-connect:
    build:
      context: ./ConnectPostgres
      dockerfile: Dockerfile
    container_name: dwh-kafka-connect
    depends_on:
      kafka:
        condition: service_started
      schema-registry:
        condition: service_healthy
      postgres-source:
        condition: service_healthy
      postgres-sink:
        condition: service_healthy
    ports:
      - "8083:8083"
    env_file:
      - ./ConnectPostgres/env.list
    networks:
      - dwh-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Kafka UI for management
  kafka-ui:
    build:
      context: ./KafkaUI
      dockerfile: Dockerfile
    container_name: dwh-kafka-ui
    depends_on:
      kafka:
        condition: service_started
      schema-registry:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - ./KafkaUI/env.list
    networks:
      - dwh-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_source_data:
  postgres_sink_data:
  kafka_data:
  zookeeper_data:
  zookeeper_logs:

networks:
  dwh-network:
    driver: bridge
