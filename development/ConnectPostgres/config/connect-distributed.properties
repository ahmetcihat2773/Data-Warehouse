# Kafka Connect Distributed Configuration for Data Warehouse Project
# This file configures a Kafka Connect worker in distributed mode

# Kafka bootstrap servers
bootstrap.servers=kafka:29092

# Connect group configuration
group.id=compose-connect-group
client.id=kafka-connect-worker

# Topic names for storing connector and task configurations
config.storage.topic=docker-connect-configs
config.storage.replication.factor=1

# Topic name for storing offsets
offset.storage.topic=docker-connect-offsets
offset.storage.replication.factor=1

# Topic name for storing statuses
status.storage.topic=docker-connect-status
status.storage.replication.factor=1

# Flush much faster than normal, which is useful for testing/debugging
offset.flush.interval.ms=10000
offset.flush.timeout.ms=5000

# These are provided to inform the user about the presence of the REST host and port configs
# but these are here just for the sake of visibility.
rest.host.name=kafka-connect
rest.port=8083
rest.advertised.host.name=kafka-connect

# Set to a list of filesystem paths separated by commas (,) to enable class loading isolation for plugins
plugin.path=/usr/share/java,/usr/share/confluent-hub-components,/etc/kafka-connect/jars

# Converter configurations
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://schema-registry:8081

# Internal converter configurations
internal.key.converter=org.apache.kafka.connect.json.JsonConverter
internal.value.converter=org.apache.kafka.connect.json.JsonConverter
internal.key.converter.schemas.enable=false
internal.value.converter.schemas.enable=false

# Producer configuration
producer.compression.type=snappy
producer.max.request.size=1048576
producer.buffer.memory=33554432

# Consumer configuration
consumer.session.timeout.ms=30000
consumer.max.poll.records=500

# Task configuration
task.shutdown.graceful.timeout.ms=30000
scheduled.rebalance.max.delay.ms=300000

# Heartbeat configuration
heartbeat.interval.ms=3000
session.timeout.ms=30000
rebalance.timeout.ms=60000

# Security configuration (development mode)
security.protocol=PLAINTEXT

# Worker configuration
worker.sync.timeout.ms=3000
worker.unsync.backoff.ms=300000 