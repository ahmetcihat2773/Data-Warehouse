apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
data:
  server.properties: |
    auto.create.topics.enable=true
    delete.topic.enable=true
    num.partitions=3
    default.replication.factor=3
    min.insync.replicas=2
    transaction.max.timeout.ms=900000
    transaction.state.log.replication.factor=3
    transaction.state.log.min.isr=2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: schema-registry-config
data:
  schema-registry.properties: |
    kafkastore.bootstrap.servers=kafka:29092
    kafkastore.security.protocol=PLAINTEXT
    kafkastore.topic=_schemas
    compatibility=BACKWARD
    master.eligibility=true
    mode=READWRITE
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-ui-config
data:
  application.yml: |
    kafka:
      clusters:
        - name: local
          bootstrapServers: kafka:29092
          metrics:
            port: 9999
            type: JMX
    schemaRegistry:
      url: http://schema-registry:8081
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: {{ .Values.kafka.replicas }}
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: {{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}
        ports:
        - containerPort: 9092
        - containerPort: 29092
        env:
        - name: KAFKA_BROKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['controller.kubernetes.io/pod-index']
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "localhost:2181"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://$(POD_NAME).kafka.$(POD_NAMESPACE).svc.cluster.local:29092,PLAINTEXT://$(POD_NAME).kafka:9092"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "PLAINTEXT:PLAINTEXT,PLAINTEXT:PLAINTEXT"
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "PLAINTEXT"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "3"
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          value: "0"
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: "2"
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: "3"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: data
          mountPath: /var/lib/kafka/data
        - name: config
          mountPath: /etc/kafka
        resources:
          {{- toYaml .Values.kafka.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: kafka-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: {{ .Values.kafka.persistence.storageClass }}
      resources:
        requests:
          storage: {{ .Values.kafka.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  ports:
  - port: 9092
    targetPort: 9092
    protocol: TCP
    name: external
  - port: 29092
    targetPort: 29092
    protocol: TCP
    name: internal
  selector:
    app: kafka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schema-registry
  template:
    metadata:
      labels:
        app: schema-registry
    spec:
      containers:
      - name: schema-registry
        image: {{ .Values.schema-registry.image.repository }}:{{ .Values.schema-registry.image.tag }}
        ports:
        - containerPort: 8081
        env:
        - name: SCHEMA_REGISTRY_HOST_NAME
          value: "schema-registry"
        - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
          value: "kafka:29092"
        volumeMounts:
        - name: config
          mountPath: /etc/schema-registry
        resources:
          {{- toYaml .Values.schema-registry.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: schema-registry-config
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
spec:
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
  selector:
    app: schema-registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
      - name: kafka-ui
        image: {{ .Values.kafka-ui.image.repository }}:{{ .Values.kafka-ui.image.tag }}
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /app/config
        resources:
          {{- toYaml .Values.kafka-ui.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: kafka-ui-config
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
spec:
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: kafka-ui 