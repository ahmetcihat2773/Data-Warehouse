        - name: POSTGRES_USER
          value: "sinkuser"
        - name: POSTGRES_PASSWORD
          value: "sinkpass"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: config
          mountPath: /etc/postgresql
        - name: init
          mountPath: /docker-entrypoint-initdb.d
        resources:
          {{- toYaml .Values.database.sink.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: postgres-sink-config
      - name: init
        configMap:
          name: postgres-sink-config
          items:
          - key: init.sql
            path: init.sql
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: {{ .Values.database.sink.persistence.storageClass }}
      resources:
        requests:
