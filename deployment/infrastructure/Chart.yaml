apiVersion: v2
name: infrastructure
description: A Helm chart for complete Kafka infrastructure (Kafka Brokers, Schema Registry, Kafka UI, PostgreSQL Databases)
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: kafka
    version: "0.1.0"
    repository: "file://../kafka"
  - name: kafka-ui
    version: "0.1.0"
    repository: "file://../kafka-ui"
  - name: schema-registry
    version: "0.1.0"
    repository: "file://../schema-registry" 