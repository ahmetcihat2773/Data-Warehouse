# Global settings
global:
  environment: production
  domain: "kafka.local"

# Kafka Brokers Configuration
kafka:
  enabled: true
  replicas: 3
  image:
    repository: confluentinc/cp-kafka
    tag: "7.4.0"
    pullPolicy: IfNotPresent
  
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
  
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "standard"
  
  config:
    autoCreateTopicsEnable: "true"
    deleteTopicEnable: "true"
    numPartitions: 3
    defaultReplicationFactor: 3
    minInsyncReplicas: 2
    transactionMaxTimeoutMs: 900000
    transactionStateLogReplicationFactor: 3
    transactionStateLogMinIsr: 2
  
  service:
    type: ClusterIP
    port: 9092
    internalPort: 29092

# Kafka UI Configuration
kafka-ui:
  enabled: true
  image:
    repository: provectuslabs/kafka-ui
    tag: "latest"
    pullPolicy: IfNotPresent
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  
  service:
    type: ClusterIP
    port: 8080
  
  config:
    kafka:
      clusters:
        - name: "local"
          bootstrapServers: "kafka:29092"
          metrics:
            port: 9999
            type: JMX
    schemaRegistry:
      url: "http://schema-registry:8081"

# Schema Registry Configuration
schema-registry:
  enabled: true
  image:
    repository: confluentinc/cp-schema-registry
    tag: "7.4.0"
    pullPolicy: IfNotPresent
  
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi
  
  service:
    type: ClusterIP
    port: 8081
  
  config:
    kafkastore:
      bootstrapServers: "kafka:29092"
      securityProtocol: "PLAINTEXT"
    kafkastore.topic: "_schemas"
    compatibility: "BACKWARD"
    master.eligibility: "true"
    mode: "READWRITE" 